    try {
      if (!sessionStorage.getItem('stb-entered') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.setAttribute('data-gate', '1');
        setTimeout(function () { document.documentElement.removeAttribute('data-gate'); }, 4200);
      }
    } catch (e) {}
  </script>

  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Person","@id":"https://spacetobe.xyz/about/#john-ooi","name":"John Ooi","url":"https://spacetobe.xyz/","description":"Meditation teacher / spiritual friend / realisation partner.","sameAs":["https://j-hn.info/","https://wonderfool.substack.com"]}
  </script>
  <style>
    :root{color-scheme:light;--paper:#F5F2EA;--ink:#1D241A;--green:#60A484}
    *{box-sizing:border-box}
    html{background:var(--paper);color:var(--ink);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    body{margin:0}
    main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:64px 24px}
    .intro{width:100%;text-align:center}
    .mark{display:block;width:100px;height:100px;margin:0 auto 32px}
    .mark circle{fill:none;stroke:var(--green);stroke-width:7}
    #gate{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:1}
    html[data-gate="1"] #gate{display:grid}
    .gate-mark{width:clamp(170px,24vmin,270px);aspect-ratio:1;transition:transform 1.2s cubic-bezier(.22,1,.36,1),opacity .2s ease}
    .gate-mark svg{display:block;width:100%;height:100%;animation:loading-breathe 2.2s cubic-bezier(.45,0,.2,1) both}
    .gate-mark circle{fill:none;stroke:var(--green);stroke-width:7}
    @keyframes loading-breathe{0%{transform:scale(.82);opacity:.56}58%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
    html[data-gate="1"] .intro{opacity:0;visibility:hidden}
    html[data-gate="1"] .intro .mark{opacity:0}
    #gate.is-travelling .gate-mark{transform:translate(var(--gate-x),var(--gate-y)) scale(var(--gate-scale))}
    @keyframes text-arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    html:not([data-gate]) .intro h1,html:not([data-gate]) .roles,html:not([data-gate]) .format,html:not([data-gate]) .email,html:not([data-gate]) nav a{animation:text-arrive .85s cubic-bezier(.22,1,.36,1) both}
    html:not([data-gate]) .roles{animation-delay:.12s}
    html:not([data-gate]) .format{animation-delay:.2s}
    html:not([data-gate]) .email{animation-delay:.26s}
    html:not([data-gate]) nav a:nth-child(1){animation-delay:.4s}
    html:not([data-gate]) nav a:nth-child(2){animation-delay:.47s}
    html:not([data-gate]) nav a:nth-child(3){animation-delay:.54s}
    .intro a:focus-visible{animation:none!important}
    h1{margin:0;font-size:clamp(32px,4vw,44px);font-weight:500;line-height:1.15;letter-spacing:-.045em}
    .roles{margin:18px auto 0;font-size:clamp(15px,1.45vw,18px);line-height:1.8;font-weight:400;text-wrap:balance}
    .roles span{white-space:nowrap}
    .format{margin:8px 0 0;font-size:14px;line-height:1.6;color:#62695e}
    a{color:inherit;text-decoration:none}
    .email{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 30px;margin-top:34px;border:1px solid rgba(96,164,132,.16);border-radius:4px;background:linear-gradient(115deg,rgba(96,164,132,.15),rgba(238,205,120,.13));color:var(--ink);font-size:15px;transition:background-color .25s ease,border-color .25s ease}
    .email:hover{background-color:rgba(96,164,132,.09);border-color:rgba(96,164,132,.3)}
    nav{display:flex;flex-wrap:wrap;justify-content:center;gap:0 28px;margin-top:30px}
    nav a{display:inline-flex;align-items:center;min-height:44px;font-size:13px;text-decoration:underline;text-decoration-color:#b2b6ab;text-underline-offset:5px;text-decoration-thickness:1px;transition:color .2s ease,text-decoration-color .2s ease}
    nav a:hover{color:#40785f;text-decoration-color:currentColor}
    a:focus-visible{outline:2px solid var(--green);outline-offset:6px}
    ::selection{background:#60a48440}
    @media(max-width:420px){main{padding:40px 22px}.roles{max-width:310px}nav{gap:0 23px}}
    @media(prefers-reduced-motion:reduce){a,.intro,.gate-mark{transition:none!important}.gate-mark svg,.intro h1,.intro .roles,.intro .format,.intro .email,.intro nav a{animation:none!important}html[data-gate="1"] #gate{display:none}html[data-gate="1"] .intro{opacity:1;visibility:visible}html[data-gate="1"] .intro .mark{opacity:1}}
  </style>
</head>
<body>
  <div id="gate" aria-hidden="true"><div class="gate-mark"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/></svg></div></div>
  <main>
    <div class="intro">
      <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="Space to Be"><circle cx="16" cy="16" r="10"/></svg>
      <h1>John Ooi</h1>
      <p class="roles"><span>meditation teacher</span> / <span>spiritual friend</span> / <span>realisation partner</span></p>
      <p class="format"><em>hourly or over six week flows</em></p>
      <a class="email" href="mailto:john@spacetobe.xyz?subject=Space%20to%20Be">Email me</a>
      <nav aria-label="Elsewhere">
        <a href="https://beingsclub.com/">Beings Club</a>
        <a href="https://wonderfool.substack.com">Wonderfool</a>
        <a href="https://j-hn.info/">about</a>
      </nav>
    </div>
  </main>
  <script>
    (function () {
      var root = document.documentElement;
      if (!root.hasAttribute('data-gate')) return;
      setTimeout(function () {
        var gate = document.getElementById('gate');
        var from = gate.querySelector('.gate-mark').getBoundingClientRect();
        var to = document.querySelector('.intro .mark').getBoundingClientRect();
        gate.style.setProperty('--gate-x', (to.left + to.width / 2 - from.left - from.width / 2) + 'px');
        gate.style.setProperty('--gate-y', (to.top + to.height / 2 - from.top - from.height / 2) + 'px');
        gate.style.setProperty('--gate-scale', String(to.width / from.width));
        try { sessionStorage.setItem('stb-entered', '1'); } catch (e) {}
        root.setAttribute('data-entering', '1');
        gate.classList.add('is-travelling');
        setTimeout(function () {
          root.removeAttribute('data-gate');
          root.removeAttribute('data-entering');
        }, 1400);
      }, 2200);
    }());
  </script>
</body>
</html>
