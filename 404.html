<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page Not Found · Space to Be</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="images/favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
  <style>
    :root{--paper:#F5F2EA;--ink:#1D241A;--green:#60A484;--shell:min(calc(100% - clamp(32px,7vw,112px)),76rem)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{background:var(--paper);color:var(--ink);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    header{position:fixed;z-index:2;top:0;left:50%;width:var(--shell);height:64px;display:flex;align-items:center;justify-content:space-between;transform:translateX(-50%)}
    .brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:600;letter-spacing:-.04em}
    .mark{width:26px;height:26px;color:var(--green)}
    .mark circle{fill:none;stroke:currentColor;stroke-width:7}
    .home-link{padding-bottom:3px;border-bottom:1px solid rgba(29,36,26,.34);font-size:14px}
    main{position:relative;width:var(--shell);height:100%;margin:auto;display:grid;align-content:center}
    h1{position:relative;z-index:1;max-width:9.6ch;font-size:clamp(4rem,10.2vw,9rem);font-weight:400;line-height:.88;letter-spacing:-.065em}
    .ring{position:absolute;z-index:0;top:50%;right:-5%;width:clamp(250px,40vw,520px);aspect-ratio:1;color:var(--green);transform:translateY(-50%);opacity:.8}
    .ring::before{content:'';position:absolute;inset:-28%;border-radius:50%;background:radial-gradient(circle,rgba(96,164,132,.34),rgba(96,164,132,.1) 48%,transparent 72%);filter:blur(30px)}
    .ring svg{position:relative;width:100%;height:100%;animation:breathe 13s ease-in-out infinite}
    .note{position:absolute;left:0;bottom:clamp(30px,5vh,54px);z-index:1;max-width:34ch;font-size:clamp(.92rem,1.4vw,1.12rem);line-height:1.55;color:rgba(29,36,26,.66)}
    @keyframes breathe{0%,100%{transform:scale(.88)}42%{transform:scale(1.08)}}
    @media(max-width:42rem){header{height:56px}.brand{font-size:16px}.home-link{font-size:12px}h1{font-size:clamp(3.7rem,17vw,6rem)}.ring{right:-38%;width:78vw;opacity:.56}.note{right:0}}
    @media(prefers-reduced-motion:reduce){.ring svg{animation:none}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html" aria-label="Space to Be home"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10"></circle></svg><span>Space to Be</span></a>
    <a class="home-link" href="index.html">Return home →</a>
  </header>
  <main>
    <h1>This space isn’t here.</h1>
    <div class="ring" aria-hidden="true"><svg viewBox="0 0 320 320"><circle cx="160" cy="160" r="71" fill="none" stroke="currentColor" stroke-width="46"></circle></svg></div>
    <p class="note">The page may have moved. There is still space to begin again.</p>
  </main>
</body>
</html>
